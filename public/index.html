<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ToDo-Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="app-header-left">
          <button id="main-menu-button" class="icon-button" aria-label="Open main menu">
            &#9776;
          </button>
          <div id="main-menu" class="main-menu hidden">
            <button id="open-settings-button" class="main-menu-item">
              Open Settings
            </button>
          </div>
          <h1>ToDo-Manager</h1>
        </div>
        <div class="app-header-right">
          <button id="new-todo-button" class="secondary">
            + New ToDo
          </button>
        </div>
      </header>

      <p class="subtitle">
        Tile-based kanban board with columns for team members and rows for status.
      </p>

      <section class="board-container">
        <div class="board-header-row" id="board-header-row">
          <!-- Unassigned + team member columns rendered here -->
        </div>
        <div class="board-body" id="board-body">
          <!-- Status rows and cells rendered here -->
        </div>
      </section>

      <footer class="app-footer">
        <span>ToDo-Manager</span>
        <span>Author: Florian Grubert</span>
      </footer>
    </div>

    <!-- New ToDo dialog -->
    <div id="todo-dialog-backdrop" class="backdrop hidden">
      <div class="dialog">
        <div class="dialog-header">
          <h2>New ToDo</h2>
          <button id="close-todo-dialog" class="icon-button" aria-label="Close">
            &times;
          </button>
        </div>
        <form id="todo-form" class="form-grid">
          <label>
            <span>Title</span>
            <input id="todo-title" type="text" required />
          </label>
          <label>
            <span>Description</span>
            <textarea id="todo-description" rows="3"></textarea>
          </label>
          <label>
            <span>Team member</span>
            <select id="todo-team-member">
              <!-- optional, unassigned if empty -->
            </select>
          </label>
          <label>
            <span>Status</span>
            <select id="todo-status" required></select>
          </label>
          <label>
            <span>Due date</span>
            <input id="todo-due-date" type="datetime-local" required />
          </label>
          <div class="form-actions">
            <button type="submit">Create ToDo</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Settings dialog -->
    <div id="settings-dialog-backdrop" class="backdrop hidden">
      <div class="dialog dialog-large">
        <div class="dialog-header">
          <h2>Settings</h2>
          <button id="close-settings-dialog" class="icon-button" aria-label="Close">
            &times;
          </button>
        </div>
        <div class="dialog-body">
          <section class="dialog-section">
            <h3>Manage Team Members</h3>
            <form id="settings-team-member-add-form" class="form-inline">
              <input
                id="settings-team-member-name"
                type="text"
                placeholder="New team member name"
                required
              />
              <button type="submit">Add</button>
            </form>
            <ul id="settings-team-member-list" class="settings-list"></ul>
          </section>

          <section class="dialog-section">
            <h3>Manage Status</h3>
            <form id="settings-status-add-form" class="form-inline">
              <input
                id="settings-status-name"
                type="text"
                placeholder="New status name"
                required
              />
              <button type="submit">Add</button>
            </form>
            <ul id="settings-status-list" class="settings-list"></ul>
          </section>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
